# Alembic migration configuration for ProcurePilot
# Reference: https://alembic.sqlalchemy.org/

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names
# file_template = %%(rev)s_%%(slug)s

# sys.path modification
prepend_sys_path = .

# Timezone to use for the `down_revision` date in migration files
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc files without a source .py file to be detected
# sourceless = false

# Version path separator; use os.pathsep for platform-specific behavior
version_path_separator = os  # Use ":" on POSIX, ";" on Windows

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
